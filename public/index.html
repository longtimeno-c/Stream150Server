<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Stream150 - Live</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
    <div class="header">
        <h1>Stream150</h1>
    </div>
    <div class="main-container">
        <div class="video-container">
            <div class="video-player">
                <video id="videoPlayer" class="video-element" playsinline controls>
                    <source src="http://localhost:8000/live/StreamtoME/index.m3u8" type="application/x-mpegURL">
                    Your browser does not support the video element.
                </video>
                <div class="status-bar">
                    <div id="status" class="status-indicator offline">
                        <span class="status-dot"></span>
                        <span id="statusText">OFFLINE</span>
                    </div>
                    <div class="viewer-count">
                        <span id="viewerCount">0</span> viewers
                    </div>
                </div>
                <div class="controls">
                    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Full Screen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2">
                            <path
                                d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m-6 18v-3m0-12V3m-9 18h3M3 8v8a2 2 0 0 0 2 2h3m10-2h3a2 2 0 0 0 2-2v-3" />
                        </svg>
                    </button>
                    <select id="qualitySelect" class="quality-select">
                        <option value="auto">Auto</option>
                    </select>
                </div>
            </div>
            <div class="donation-section">
                <div class="donation-buttons">
                    <button class="tangia-btn" onclick="window.open('https://tangia.co/westboys1912')">
                        <img src="https://cdn-icons-png.flaticon.com/512/888/888879.png" alt="Tangia Logo"
                            class="btn-logo">
                        Tangia
                    </button>
                    <button class="paypal-btn" onclick="window.open('https://www.paypal.com/pool/9c2agpViJU?sr=ancr')">
                        <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg"
                            alt="PayPal Logo" class="btn-logo">
                        PayPal
                    </button>
                </div>
                <div class="donation-tracker">
                    <h2>Stream Donation Progress</h2>
                    <p id="current-donations">Loading donations...</p>
                    <div id="progress-container">
                        <div id="progress-bar">0%</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-header">
                <h3>Live Chat</h3>
                <span class="chat-status"></span>
            </div>
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Send a message...">
                <button class="chat-send-btn" onclick="sendChat()">Send</button>
            </div>
            <div id="countdown" class="below-chat-countdown"></div>
        </div>
    </div>

    <button class="chat-toggle" onclick="toggleChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Chat
    </button>

    <div class="mobile-chat-overlay" id="mobileChatOverlay">
        <div class="mobile-chat-header">
            <h3>Live Chat</h3>
            <button class="close-chat-btn" onclick="toggleChat()">×</button>
        </div>
        <div id="mobileChatBox" class="chat-box"></div>
        <div class="chat-input-container">
            <input type="text" id="mobileChatInput" class="chat-input" placeholder="Send a message...">
            <button class="chat-send-btn" onclick="sendMobileChat()">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('videoPlayer');
            // Update this URL to your public server address
            const hlsUrl = `https://watch.stream150.com:8000/live/StreamtoME/index.m3u8`;
            let hls = null;

            if (Hls.isSupported()) {
                console.log('✅ HLS.js is supported');
                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    // Add retry configuration
                    manifestLoadingMaxRetry: 6,
                    manifestLoadingRetryDelay: 1000,
                    manifestLoadingMaxRetryTimeout: 10000,
                    levelLoadingMaxRetry: 6,
                    levelLoadingRetryDelay: 1000,
                    levelLoadingMaxRetryTimeout: 10000
                });

                console.log('🔄 Loading stream source:', hlsUrl);

                // Add manifest loading error handler
                hls.on(Hls.Events.MANIFEST_LOADING, () => {
                    console.log('📡 Attempting to load HLS manifest...');
                });

                hls.loadSource(hlsUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('✅ HLS manifest parsed, attempting playback');
                    video.play().catch(e => console.log('❌ Autoplay failed:', e));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('❌ HLS Error:', data);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('🔄 Network error, attempting recovery...');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('🔄 Media error, attempting recovery...');
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log('💀 Fatal error, destroying player...');
                                if (hls) {
                                    hls.destroy();
                                    hls = null;
                                }
                                break;
                        }
                    }
                });
            }
            // For browsers that natively support HLS (like Safari)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = hlsUrl;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(function (error) {
                        console.log('Playback failed:', error);
                    });
                });
            }
            else {
                console.error('HLS is not supported in this browser');
                // Update UI to show error state
                const statusElement = document.getElementById('status');
                const statusTextElement = document.getElementById('statusText');
                if (statusElement && statusTextElement) {
                    statusElement.classList.add('offline');
                    statusTextElement.textContent = 'NOT SUPPORTED';
                }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/donations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/countdown.js"></script>
</body>

</html>
