<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Stream150 - Live</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
    <div class="header">
        <h1>Stream150</h1>
    </div>
    <div class="main-container">
        <div class="video-container">
            <div class="video-player">
                <video id="videoPlayer" class="video-element" playsinline controls>
                    <source src="" type="application/x-mpegURL">
                    Your browser does not support the video element.
                </video>
                <div class="status-bar">
                    <div id="status" class="status-indicator offline">
                        <span class="status-dot"></span>
                        <span id="statusText">OFFLINE</span>
                    </div>
                    <div class="viewer-count">
                        <span id="viewerCount">0</span> viewers
                    </div>
                </div>
                <div class="controls">
                    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Full Screen">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                        </svg>
                    </button>
                    <select id="qualitySelect" class="quality-select">
                        <option value="auto">Auto</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-header">
                <h3>Live Chat</h3>
                <span class="chat-status"></span>
            </div>
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Send a message...">
                <button class="chat-send-btn" onclick="sendChat()">Send</button>
            </div>
            <div id="countdown" class="below-chat-countdown"></div>
        </div>
    </div>

    <button class="chat-toggle" onclick="toggleChat()" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Chat
    </button>

    <div class="mobile-chat-overlay" id="mobileChatOverlay" style="display: none;">
        <div class="mobile-chat-header">
            <h3>Live Chat</h3>
            <button class="close-chat-btn" onclick="toggleChat()">×</button>
        </div>
        <div id="mobileChatBox" class="chat-box"></div>
        <div class="chat-input-container">
            <input type="text" id="mobileChatInput" class="chat-input" placeholder="Send a message...">
            <button class="chat-send-btn" onclick="sendMobileChat()">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('videoPlayer');
            const isProduction = window.location.hostname === 'watch.stream150.com';
            const protocol = isProduction ? 'https' : 'http';
            const wsProtocol = isProduction ? 'wss' : 'ws';
            const host = window.location.host;  // This will include the port if any
            const baseUrl = isProduction ? '' : `${protocol}://${host}`;
            
            // Configure stream URL (through Caddy's reverse proxy)
            const hlsUrl = isProduction 
                ? '/live/StreamtoME/index.m3u8'  // Update this path
                : `${protocol}://localhost:8000/live/StreamtoME/index.m3u8`;  // This is correct
            
            // WebSocket URL (through Caddy's reverse proxy)
            window.WS_URL = isProduction
                ? `${wsProtocol}://${host}/ws`  // Production WebSocket through Caddy
                : `${wsProtocol}://localhost:3001`;  // Direct in development
            
            let hls = null;

            if (Hls.isSupported()) {
                console.log('✅ HLS.js is supported');
                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    },
                    // Updated configuration format
                    manifestLoadPolicy: {
                        default: {
                            maxTimeToFirstByteMs: null,
                            maxLoadTimeMs: 20000,
                            timeoutRetry: {
                                maxNumRetry: 6,
                                retryDelayMs: 1000,
                                maxRetryDelayMs: 10000
                            },
                            errorRetry: {
                                maxNumRetry: 6,
                                retryDelayMs: 1000,
                                maxRetryDelayMs: 10000
                            }
                        }
                    },
                    playlistLoadPolicy: {
                        default: {
                            maxTimeToFirstByteMs: 10000,
                            maxLoadTimeMs: 20000,
                            timeoutRetry: {
                                maxNumRetry: 6,
                                retryDelayMs: 1000,
                                maxRetryDelayMs: 10000
                            },
                            errorRetry: {
                                maxNumRetry: 6,
                                retryDelayMs: 1000,
                                maxRetryDelayMs: 10000
                            }
                        }
                    }
                });

                // Remove the source element to prevent conflicts
                const sourceElement = video.querySelector('source');
                if (sourceElement) {
                    video.removeChild(sourceElement);
                }
                video.src = '';

                console.log('🔄 Loading stream source:', hlsUrl);

                hls.on(Hls.Events.MANIFEST_LOADING, () => {
                    console.log('�� Attempting to load HLS manifest...');
                });

                hls.loadSource(hlsUrl);
                hls.attachMedia(video);

                // Make hls instance available globally for quality selection
                window.hls = hls;

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('✅ HLS manifest parsed, attempting playback');
                    video.play().catch(e => console.log('❌ Autoplay failed:', e));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('❌ HLS Error:', data);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('🔄 Network error, attempting recovery...');
                                
                                // Check if this is a 404 error (stream not available)
                                if (data.response && data.response.code === 404) {
                                    console.log('⚠️ Stream not available (404). Waiting for stream to start...');
                                    
                                    // Update UI to show waiting state
                                    const statusElement = document.getElementById('status');
                                    const statusTextElement = document.getElementById('statusText');
                                    if (statusElement && statusTextElement) {
                                        statusElement.classList.remove('online');
                                        statusElement.classList.add('offline');
                                        statusTextElement.textContent = 'WAITING FOR STREAM';
                                    }
                                    
                                    // Retry loading after a delay
                                    setTimeout(() => {
                                        console.log('🔄 Retrying stream load...');
                                        hls.startLoad();
                                    }, 5000); // Retry every 5 seconds
                                } else {
                                    // For other network errors, try immediate recovery
                                    hls.startLoad();
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('🔄 Media error, attempting recovery...');
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log('💀 Fatal error, destroying player...');
                                if (hls) {
                                    hls.destroy();
                                    hls = null;
                                }
                                break;
                        }
                    }
                });
            }
            // For browsers that natively support HLS (like Safari)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = hlsUrl;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(function (error) {
                        console.log('Playback failed:', error);
                    });
                });
            }
            else {
                console.error('HLS is not supported in this browser');
                // Update UI to show error state
                const statusElement = document.getElementById('status');
                const statusTextElement = document.getElementById('statusText');
                if (statusElement && statusTextElement) {
                    statusElement.classList.add('offline');
                    statusTextElement.textContent = 'NOT SUPPORTED';
                }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/donations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/countdown.js"></script>
</body>

</html>
