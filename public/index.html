<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream150 - Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #2d2d2d;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #404040;
        }

        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 25px;
            min-height: calc(100vh - 72px);
        }

        .video-container {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-player {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #222, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .status-bar {
            background: #2d2d2d;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404040;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .live .status-dot {
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
        }

        .offline .status-dot {
            background: #666;
        }

        .viewer-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .controls {
            padding: 15px;
            background: #2d2d2d;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .fullscreen-btn {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 4px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .fullscreen-btn:hover {
            background: #f0f0f0;
        }

        .donation-buttons {
            padding: 0 15px 15px;
            display: flex;
            gap: 15px;
        }

        .donation-buttons .paypal-btn {
            background: #0070BA;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
        }

        .donation-buttons .paypal-btn:hover {
            background: #005EA6;
        }

        .donation-buttons .tangia-btn {
            background: #FF6200;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
        }

        .donation-buttons .tangia-btn:hover {
            background: #E55B00;
        }

        .donation-buttons .btn-logo {
            height: 20px;
            width: auto;
        }

        .donation-tracker {
            padding: 15px;
            background: #2d2d2d;
        }

        .donation-tracker h2 {
            text-align: center;
            font-size: clamp(1rem, 2vw, 1.5rem);
            margin: 0.5rem 0;
        }

        .donation-tracker p {
            text-align: center;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            margin: 0.5rem 0;
        }

        #progress-container {
            position: relative;
            width: 100%;
            height: clamp(20px, 6vw, 40px);
            background-color: #333;
            border-radius: 8px;
            margin: clamp(10px, 3vw, 20px) 0;
        }

        #progress-bar {
            height: 100%;
            width: 0;
            background-color: #4caf50;
            border-radius: 8px;
            text-align: right;
            line-height: clamp(20px, 6vw, 40px);
            padding-right: 0.4rem;
            box-sizing: border-box;
            color: white;
            font-weight: bold;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            transition: width 0.5s ease-in-out;
        }

        .milestone {
            position: absolute;
            top: 100%;
            width: 1px;
            height: clamp(10px, 3vw, 20px);
            background-color: #ffffff;
        }

        .milestone-label {
            position: absolute;
            top: calc(100% + clamp(10px, 3vw, 20px));
            transform: translateX(-50%);
            text-align: center;
            font-size: clamp(0.6rem, 2vw, 0.875rem);
            white-space: nowrap;
        }

        .stream-time {
            font-size: clamp(0.5rem, 1.5vw, 0.75rem);
            color: #aaaaaa;
            display: block;
        }

        .chat-container {
            flex: 1;
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .chat-box {
            flex-grow: 1;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input {
            flex-grow: 1;
            background: #333;
            color: #fff;
        }

        input:focus {
            outline: none;
            background: #3a3a3a;
        }

        select {
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        button {
            background: #007bff;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        h3 {
            margin-bottom: 15px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Stream150</h1>
    </div>
    <div class="main-container">
        <div class="video-container">
            <div class="video-player">
                <div id="videoPlaceholder" class="video-placeholder">
                    Waiting for stream...
                </div>
                <div class="status-bar">
                    <div id="status" class="status-indicator offline">
                        <span class="status-dot"></span>
                        <span id="statusText">OFFLINE</span>
                    </div>
                    <div class="viewer-count">
                        <span id="viewerCount">0</span> viewers
                    </div>
                </div>
                <div class="controls">
                    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Full Screen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m-6 18v-3m0-12V3m-9 18h3M3 8v8a2 2 0 0 0 2 2h3m10-2h3a2 2 0 0 0 2-2v-3"/>
                        </svg>
                    </button>
                    <select id="qualitySelect" onchange="changeQuality()">
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                    </select>
                </div>
                <div class="donation-buttons">
                    <button class="tangia-btn" onclick="window.open('https://tangia.co/donate')">
                        <img src="https://via.placeholder.com/20x20?text=T" alt="Tangia Logo" class="btn-logo">
                        Tangia Donation
                    </button>
                    <button class="paypal-btn" onclick="window.open('https://paypal.me/donate')">
                        <img src="https://via.placeholder.com/20x20?text=P" alt="PayPal Logo" class="btn-logo">
                        PayPal Donation
                    </button>
                </div>
                <div class="donation-tracker">
                    <h2>Stream Donation Progress</h2>
                    <p id="current-donations">Loading donations...</p>
                    <div id="progress-container">
                        <div id="progress-bar">0%</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <h3>Live Chat</h3>
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:3001');
        const statusElement = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const viewerCount = document.getElementById('viewerCount');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');

        // Donation tracker variables
        const paypalPoolUrl = 'https://www.paypal.com/pool/9c2agpViJU?sr=ancr';
        const totalGoal = 1000;
        const manualDonationAmount = 0;
        const milestones = [
            { amount: 100, hours: 48 },
            { amount: 200, hours: 75 },
            { amount: 500, hours: 100 },
            { amount: 700, hours: 150 }
        ];

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'STREAM_STATUS') {
                statusText.textContent = data.status;
                statusElement.className = 'status-indicator ' + 
                    (data.status === 'LIVE' ? 'live' : 'offline');
                videoPlaceholder.textContent = 
                    data.status === 'LIVE' ? 'Stream is Live!' : 'Waiting for stream...';
                if (data.viewers !== undefined) {
                    viewerCount.textContent = data.viewers;
                }
            } else if (data.type === 'VIEWER_COUNT') {
                viewerCount.textContent = data.viewers;
            } else if (data.type === 'CHAT_MESSAGE') {
                const messageDiv = document.createElement('div');
                messageDiv.textContent = data.message;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        ws.onclose = () => {
            statusText.textContent = 'DISCONNECTED';
            statusElement.className = 'status-indicator offline';
        };

        function toggleFullscreen() {
            const player = document.querySelector('.video-player');
            if (!document.fullscreenElement) {
                player.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function changeQuality() {
            const quality = document.getElementById('qualitySelect').value;
            console.log('Quality changed to:', quality);
        }

        function sendChat() {
            const message = chatInput.value.trim();
            if (message) {
                ws.send(JSON.stringify({
                    type: 'CHAT_MESSAGE',
                    message: message
                }));
                chatInput.value = '';
            }
        }

        // Donation tracker functions
        function createMilestoneMarkers() {
            const container = document.getElementById('progress-container');
            milestones.forEach(milestone => {
                const position = (milestone.amount / totalGoal) * 100;
                const milestoneLine = document.createElement('div');
                milestoneLine.className = 'milestone';
                milestoneLine.style.left = position + '%';
                container.appendChild(milestoneLine);

                const label = document.createElement('div');
                label.className = 'milestone-label';
                label.style.left = position + '%';
                label.innerHTML = `£${milestone.amount}<br><span class="stream-time">${milestone.hours} hrs</span>`;
                container.appendChild(label);
            });
        }

        async function fetchDonationAmount() {
            try {
                const response = await fetch(paypalPoolUrl);
                const text = await response.text();
                const donationMatch = text.match(/"currencyAmount":"([0-9.]+)"/);
                return donationMatch && donationMatch[1] ? parseFloat(donationMatch[1]) : manualDonationAmount;
            } catch (error) {
                console.error('Error fetching donation data:', error);
                return manualDonationAmount;
            }
        }

        function calculateStreamLength(donationAmount) {
            let streamLength = 48;
            for (const milestone of milestones) {
                if (donationAmount >= milestone.amount) {
                    streamLength = milestone.hours;
                }
            }
            return streamLength;
        }

        async function updateDonationUI() {
            const donationAmount = await fetchDonationAmount();
            const source = (donationAmount === manualDonationAmount && donationAmount !== 0) 
                ? ' (Manual)' 
                : ' (PayPal)';
                
            document.getElementById('current-donations').innerText = 
                `Current Donations: £${donationAmount.toFixed(2)}${source}`;

            const progressPercentage = Math.min((donationAmount / totalGoal) * 100, 100);
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = progressPercentage + '%';
            progressBar.innerText = `${progressPercentage.toFixed(1)}%`;

            document.querySelectorAll('.milestone-label').forEach(label => {
                const milestoneAmount = parseInt(label.innerText.replace('£', ''));
                label.style.color = donationAmount >= milestoneAmount ? '#4caf50' : '#ffffff';
            });
        }

        // Initialize
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });
        createMilestoneMarkers();
        setInterval(updateDonationUI, 30000);
        updateDonationUI();
    </script>
</body>
</html>
