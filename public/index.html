<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream150 - Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #2d2d2d;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #404040;
        }

        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 25px;
            min-height: calc(100vh - 72px);
        }

        .video-container {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-player {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #222, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .status-bar {
            background: #2d2d2d;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404040;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .live .status-dot {
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
        }

        .offline .status-dot {
            background: #666;
        }

        .viewer-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .controls {
            padding: 15px;
            background: #2d2d2d;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .donation-buttons {
            padding: 0 15px 15px;
            display: flex;
            gap: 15px;
        }

        .chat-container {
            flex: 1;
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .chat-box {
            flex-grow: 1;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input {
            flex-grow: 1;
            background: #333;
            color: #fff;
        }

        input:focus {
            outline: none;
            background: #3a3a3a;
        }

        select {
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        button {
            background: #007bff;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .donation-buttons button {
            background: #28a745;
        }

        .donation-buttons button:hover {
            background: #218838;
        }

        h3 {
            margin-bottom: 15px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Stream150</h1>
    </div>
    <div class="main-container">
        <div class="video-container">
            <div class="video-player">
                <div id="videoPlaceholder" class="video-placeholder">
                    Waiting for stream...
                </div>
                <div class="status-bar">
                    <div id="status" class="status-indicator offline">
                        <span class="status-dot"></span>
                        <span id="statusText">OFFLINE</span>
                    </div>
                    <div class="viewer-count">
                        <span id="viewerCount">0</span> viewers
                    </div>
                </div>
                <div class="controls">
                    <button onclick="toggleFullscreen()">Full Screen</button>
                    <select id="qualitySelect" onchange="changeQuality()">
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                    </select>
                </div>
                <div class="donation-buttons">
                    <button onclick="window.open('https://tangia.co/donate')">Tangia Donation</button>
                    <button onclick="window.open('https://paypal.me/donate')">PayPal Donation</button>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <h3>Live Chat</h3>
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:3001');
        const statusElement = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const viewerCount = document.getElementById('viewerCount');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'STREAM_STATUS') {
                statusText.textContent = data.status;
                statusElement.className = 'status-indicator ' + 
                    (data.status === 'LIVE' ? 'live' : 'offline');
                videoPlaceholder.textContent = 
                    data.status === 'LIVE' ? 'Stream is Live!' : 'Waiting for stream...';
                if (data.viewers !== undefined) {
                    viewerCount.textContent = data.viewers;
                }
            } else if (data.type === 'VIEWER_COUNT') {
                viewerCount.textContent = data.viewers;
            } else if (data.type === 'CHAT_MESSAGE') {
                const messageDiv = document.createElement('div');
                messageDiv.textContent = data.message;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        ws.onclose = () => {
            statusText.textContent = 'DISCONNECTED';
            statusElement.className = 'status-indicator offline';
        };

        function toggleFullscreen() {
            const player = document.querySelector('.video-player');
            if (!document.fullscreenElement) {
                player.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function changeQuality() {
            const quality = document.getElementById('qualitySelect').value;
            // Add your quality change logic here
            console.log('Quality changed to:', quality);
        }

        function sendChat() {
            const message = chatInput.value.trim();
            if (message) {
                ws.send(JSON.stringify({
                    type: 'CHAT_MESSAGE',
                    message: message
                }));
                chatInput.value = '';
            }
        }

        // Press Enter to send chat
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendChat();
            }
        });
    </script>
</body>
</html>
