<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Stream150 - Live</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <h1>Stream150</h1>
    </div>
    <div class="main-container">
        <div class="video-container">
            <div class="video-player">
                <video id="videoPlayer" class="video-element" playsinline>
                    Your browser does not support the video element.
                </video>
                <video id="videoPlaceholder" class="video-placeholder" playsinline loop muted autoplay>
                    <source src="logo.mp4" type="video/mp4">
                     Waiting...
                </video>
                <div class="status-bar">
                    <div id="status" class="status-indicator offline">
                        <span class="status-dot"></span>
                        <span id="statusText">OFFLINE</span>
                    </div>
                    <div class="viewer-count">
                        <span id="viewerCount">0</span> viewers
                    </div>
                </div>
                <div class="controls">
                    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Full Screen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m-6 18v-3m0-12V3m-9 18h3M3 8v8a2 2 0 0 0 2 2h3m10-2h3a2 2 0 0 0 2-2v-3"/>
                        </svg>
                    </button>
                    <select id="qualitySelect" onchange="changeQuality()">
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                    </select>
                </div>
                <div class="donation-buttons">
                    <button class="tangia-btn" onclick="window.open('https://tangia.co/westboys1912')">
                        <img src="https://cdn-icons-png.flaticon.com/512/888/888879.png" alt="Tangia Logo" class="btn-logo">
                        Tangia
                    </button>
                    <button class="paypal-btn" onclick="window.open('https://www.paypal.com/pool/9c2agpViJU?sr=ancr')">
                        <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg" alt="PayPal Logo" class="btn-logo">
                        PayPal
                    </button>
                </div>
                <div class="donation-tracker">
                    <h2>Stream Donation Progress</h2>
                    <p id="current-donations">Loading donations...</p>
                    <div id="progress-container">
                        <div id="progress-bar">0%</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-header">
                <h3>Live Chat</h3>
                <span class="chat-status"></span>
            </div>
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Send a message...">
                <button class="chat-send-btn" onclick="sendChat()">Send</button>
            </div>
            <div id="countdown" class="below-chat-countdown"></div>
        </div>
    </div>

    <button class="chat-toggle" onclick="toggleChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Chat
    </button>

    <div class="mobile-chat-overlay" id="mobileChatOverlay">
        <div class="mobile-chat-header">
            <h3>Live Chat</h3>
            <button class="close-chat-btn" onclick="toggleChat()">×</button>
        </div>
        <div id="mobileChatBox" class="chat-box"></div>
        <div class="chat-input-container">
            <input type="text" id="mobileChatInput" class="chat-input" placeholder="Send a message...">
            <button class="chat-send-btn" onclick="sendMobileChat()">Send</button>
        </div>
    </div>

    <script src="js/websocket.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/donations.js"></script>
    <script src="js/ui.js"></script>
    <script src="/js/countdown.js"></script>
</body>
</html>
