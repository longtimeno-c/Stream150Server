<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream150 - Live</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #2d2d2d;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #404040;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-container, .chat-container {
            width: 100%;
        }

        .video-player {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #222, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .donation-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .donation-buttons button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
        }

        .tangia-btn {
            background-color: #FF6200;
        }

        .paypal-btn {
            background-color: #0070ba;
        }

        .donation-buttons img {
            height: 20px;
            width: auto;
        }

        @media (min-width: 800px) {
            .main-container {
                display: flex;
                flex-direction: row;
            }

            .video-container {
                flex: 2;
            }

            .chat-container {
                flex: 1;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Stream150</h1>
    </div>

    <div class="main-container">
        <div class="video-container">
            <div class="video-player">
                <div class="video-placeholder">Live Stream Loading...</div>
            </div>

            <div class="donation-buttons">
                <button class="tangia-btn" onclick="window.open('https://tangia.co/donate')">
                    <img src="https://tangia.co/logo.png" alt="Tangia" width="20"> Tangia
                </button>
                <button class="paypal-btn" onclick="window.open('https://www.paypal.com/pool/9c2agpViJU?sr=ancr')">
                    <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal" width="20"> PayPal
                </button>
            </div>
    </div>

    <div class="main-container">
        <div class="chat-container">
            <h3>Chat</h3>
            <div id="chatBox" class="chat-box">Loading chat...</div>
            <input type="text" placeholder="Type your message...">
        </div>
    </div>

    <script>
        // Replace this with your actual chat implementation
        function sendChat() {
            console.log('Message sent!');
        }

        function toggleFullscreen() {
            const player = document.querySelector('.video-player');
            if (!document.fullscreenElement) {
                player.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
